name: Release & Publish SDK

on:
  push:
    tags:
      - "sdks/dotnet/v*"

jobs:
  publish-nuget:
    name: Pack and Publish SDK to NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build SDK Project
        run: dotnet build sdks/dotnet/ToggleMesh.SDK/ToggleMesh.SDK.csproj -c Release

      - name: Pack SDK NuGet Package
        run: dotnet pack sdks/dotnet/ToggleMesh.SDK/ToggleMesh.SDK.csproj -c Release --no-build -o ./artifacts -p:BuildProjectReferences=false

      - name: NuGet Login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: sdwcktarakanov

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
